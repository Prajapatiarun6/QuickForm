<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickForm — Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#172033;font:16px system-ui,-apple-system,sans-serif;padding:18px}.card{width:min(420px,100%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 10px 35px #17203312}h1{font-size:32px;margin:0 0 6px}h2{font-size:17px;font-weight:500;color:#475569;margin:0 0 26px}.field{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin:7px 0}.password-wrap{display:flex;align-items:center;position:relative}.password-wrap input{padding-right:75px}.show{position:absolute;right:8px;border:0;background:transparent;color:#2563eb;cursor:pointer;font:inherit;padding:8px}button.action{width:100%;padding:13px;border:0;border-radius:9px;font:inherit;font-weight:600;background:#2563eb;color:#fff;cursor:pointer;margin:8px 0}button.secondary{background:#fff;color:#172033;border:1px solid #cbd5e1}button:disabled{opacity:.6;cursor:wait}.google{display:flex;align-items:center;justify-content:center;gap:12px}.google svg{width:20px;height:20px}.divider{text-align:center;color:#64748b;margin:15px 0}.forgot{background:none;border:0;color:#2563eb;font:inherit;cursor:pointer;padding:9px 0}.message{min-height:25px;color:#b91c1c;line-height:1.5;font-size:14px}.message.ok{color:#166534}.hint{color:#64748b;font-size:13px;line-height:1.5;margin-top:8px}
</style></head><body><main class="card"><h1>QuickForm</h1><h2>Admin Login</h2>
<button class="action secondary google" id="google" type="button"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.28 5.48-4.83 7.18l7.73 6C44.35 38.03 46.98 31.87 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A23.9 23.9 0 0 0 0 24c0 3.87.93 7.51 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.92-2.13 15.89-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.97 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button>
<div class="divider">— or —</div><form id="login-form"><label for="email">Email</label><input class="field" id="email" type="email" placeholder="admin@example.com" autocomplete="email" required><label for="password">Password</label><div class="password-wrap"><input class="field" id="password" type="password" placeholder="Password" autocomplete="current-password" required minlength="6"><button class="show" id="show-password" type="button" aria-label="Show password">Show</button></div><button class="action" id="login" type="submit">Sign In</button></form>
<button class="action secondary" id="signup" type="button">Create Account</button><button class="forgot" id="forgot" type="button">Forgot password?</button><div class="message" id="message" role="status" aria-live="polite"></div><button class="forgot" id="resend" type="button" hidden>Resend verification email</button></main>
<script type="module">
const msg=document.getElementById('message'), email=document.getElementById('email'), password=document.getElementById('password'), resend=document.getElementById('resend');
const csrf={{csrf|tojson}},firebaseConfig={{firebase|tojson}};
const setMessage=(text,ok=false)=>{msg.textContent=text;msg.classList.toggle('ok',ok)};
const buttons=[...document.querySelectorAll('button')];
let auth,api;
try{
 const [{initializeApp},firebaseAuth]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js')]);
 api=firebaseAuth;auth=api.getAuth(initializeApp(firebaseConfig));
}catch(e){setMessage('Firebase could not load. Check your internet connection, then refresh.');}
function friendly(e){const codes={'auth/invalid-credential':'Incorrect email or password.','auth/wrong-password':'Incorrect email or password.','auth/user-not-found':'No account found for this email.','auth/email-already-in-use':'This email already has an account. Try Sign In.','auth/weak-password':'Choose a password with at least 6 characters.','auth/invalid-email':'Enter a valid email address.','auth/operation-not-allowed':'Enable this sign-in method in Firebase Console → Authentication → Sign-in method.','auth/unauthorized-domain':'Add localhost to Firebase Authentication → Settings → Authorized domains.','auth/popup-blocked':'Allow pop-ups for this site and try again.','auth/popup-closed-by-user':'Google sign-in was cancelled.','auth/network-request-failed':'Network error. Check your internet connection.'};return codes[e?.code]||e?.message||'Something went wrong.'}
async function run(fn){if(!auth){setMessage('Firebase is not ready. Refresh the page.');return}buttons.forEach(b=>b.disabled=true);setMessage('Please wait...');resend.hidden=true;try{await fn()}catch(e){setMessage(friendly(e));if(e?.message?.includes('verify your email'))resend.hidden=false}finally{buttons.forEach(b=>b.disabled=false)}}
async function finish(user){await user.reload();if(!user.emailVerified){resend.hidden=false;throw Error('Please verify your email first. Check your inbox or resend the verification email.')}const idToken=await user.getIdToken(true);const response=await fetch('/auth/session',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({idToken})});const data=await response.json();if(!response.ok)throw Error(data.error||'Login failed');location.assign(data.redirect||'/dashboard')}
document.getElementById('show-password').onclick=()=>{const visible=password.type==='text';password.type=visible?'password':'text';document.getElementById('show-password').textContent=visible?'Show':'Hide';document.getElementById('show-password').setAttribute('aria-label',visible?'Show password':'Hide password')};
document.getElementById('login-form').onsubmit=e=>{e.preventDefault();run(async()=>finish((await api.signInWithEmailAndPassword(auth,email.value.trim(),password.value)).user))};
document.getElementById('google').onclick=()=>run(async()=>finish((await api.signInWithPopup(auth,new api.GoogleAuthProvider())).user));
document.getElementById('signup').onclick=()=>run(async()=>{if(!email.value.trim()||!password.value)throw Error('Enter an email and password first.');const user=(await api.createUserWithEmailAndPassword(auth,email.value.trim(),password.value)).user;await api.sendEmailVerification(user);setMessage('Account created! Check your inbox and spam folder. Verify your email, then Sign In.',true)});
document.getElementById('forgot').onclick=()=>run(async()=>{if(!email.value.trim())throw Error('Enter your email first.');await api.sendPasswordResetEmail(auth,email.value.trim());setMessage('If this email has an account, a password reset link has been sent.',true)});
resend.onclick=()=>run(async()=>{const user=auth.currentUser;if(!user){setMessage('Sign in first, then use Resend verification email.');return}await api.sendEmailVerification(user);setMessage('Verification email sent. Check inbox and spam.',true)});
</script></body></html>
