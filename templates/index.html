<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ form_title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f1f5f9; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); width: 100%; max-width: 440px; border: 1px solid #e2e8f0; }
        h2 { color: #1e3a8a; margin-bottom: 20px; text-align: center; font-size: 1.3rem; font-weight: 800; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #334155; }
        input[type="text"] { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 15px; outline: none; }
        input:focus { border-color: #2563eb; }
        .btn-submit { width: 100%; background: #1e3a8a; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .status-msg { font-size: 12px; font-weight: 600; margin-top: 5px; min-height: 18px; }
        .new-field-badge { display: inline-block; background: #dcfce7; color: #15803d; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>{{ form_title }}</h2>

        <form id="student-form" method="POST" action="/form/{{ form_id }}">
            {% for field in fields %}
            <div class="form-group" id="group_{{ loop.index0 }}">
                <label id="label_{{ loop.index0 }}">{{ field }}</label>
                <input type="text" 
                       name="field_{{ loop.index0 }}" 
                       id="input_{{ loop.index0 }}" 
                       placeholder="Enter {{ field }}" 
                       required>
                {% if loop.first %}
                <div id="status-msg" class="status-msg"></div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn-submit">Submit Details</button>
        </form>
    </div>

    <script>
        const firstInput = document.getElementById('input_0');
        const secondInput = document.getElementById('input_1');
        const statusMsg = document.getElementById('status-msg');
        const allInputs = Array.from(document.querySelectorAll('input[name^="field_"]'));
        const fieldsList = {{ fields | tojson }};
        let isMultipleMatches = false;

        function resetVisibility() {
            fieldsList.forEach((_, index) => {
                const groupEl = document.getElementById(`group_${index}`);
                if (groupEl) groupEl.style.display = 'block';
                const labelEl = document.getElementById(`label_${index}`);
                if (labelEl) labelEl.innerHTML = fieldsList[index];
            });
            if (statusMsg) statusMsg.innerText = "";
        }

        function checkPrimary(pVal) {
            if (!pVal) {
                resetVisibility();
                isMultipleMatches = false;
                return;
            }
            fetch('/verify-data/{{ form_id }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ primary: pVal })
            })
            .then(r => r.json())
            .then(data => {
                if (data.found) {
                    fillFormAndHideFilled(data.data);
                    isMultipleMatches = false;
                } else if (data.needs_secondary) {
                    isMultipleMatches = true;
                    if (statusMsg) {
                        statusMsg.style.color = "#d97706";
                        statusMsg.innerText = "⚠️ Multiple records match! Fill next detail to verify.";
                    }
                } else {
                    resetVisibility();
                    isMultipleMatches = false;
                }
            });
        }

        function checkSecondary() {
            if (!isMultipleMatches || !firstInput) return;
            const pVal = firstInput.value.trim();
            const sVal = secondInput ? secondInput.value.trim() : "";
            if (!pVal || !sVal) return;

            fetch('/verify-data/{{ form_id }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ primary: pVal, secondary: sVal })
            })
            .then(r => r.json())
            .then(data => {
                if (data.found) {
                    fillFormAndHideFilled(data.data);
                    isMultipleMatches = false;
                }
            });
        }

        function fillFormAndHideFilled(dataDict) {
            const normData = {};
            if (dataDict && typeof dataDict === 'object') {
                Object.keys(dataDict).forEach(k => {
                    normData[k.trim().toLowerCase()] = dataDict[k];
                });
            }

            let hasNewFields = false;

            fieldsList.forEach((field, index) => {
                const inputEl = document.getElementById(`input_${index}`);
                const groupEl = document.getElementById(`group_${index}`);
                const normField = field.trim().toLowerCase();

                const val = normData[normField];

                // Index 0 (Unique Identifier) stays visible
                if (index === 0) {
                    if (groupEl) groupEl.style.display = 'block';
                    return;
                }

                // If existing field has filled data in DB -> HIDE IT COMPLETELY!
                if (val !== undefined && val !== null && val.toString().trim() !== "") {
                    if (inputEl) inputEl.value = val;
                    if (groupEl) groupEl.style.display = 'none';
                } else {
                    // SHOW ONLY NEW UNFILLED FIELDS WITH GREEN BADGE
                    if (groupEl) groupEl.style.display = 'block';
                    const labelEl = document.getElementById(`label_${index}`);
                    if (labelEl && !labelEl.innerHTML.includes('NEW FIELD')) {
                        labelEl.innerHTML = `<span class="new-field-badge">🟢 NEW FIELD TO FILL</span><br>${field}`;
                    }
                    hasNewFields = true;
                }
            });

            if (statusMsg) {
                statusMsg.style.color = "#16a34a";
                if (hasNewFields) {
                    statusMsg.innerText = "✓ Data Fetched! Old details hidden, fill new field(s) below:";
                } else {
                    statusMsg.innerText = "✓ All details verified! Old fields hidden.";
                }
            }
        }

        if (firstInput) {
            firstInput.addEventListener('blur', function() {
                checkPrimary(this.value.trim());
            });
        }

        if (secondInput) {
            secondInput.addEventListener('blur', checkSecondary);
            secondInput.addEventListener('keyup', checkSecondary);
        }

        allInputs.forEach((input, index) => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();

                    if (index === 0) {
                        checkPrimary(this.value.trim());
                    } else if (index === 1 && isMultipleMatches) {
                        checkSecondary();
                    }

                    if (index < allInputs.length - 1) {
                        allInputs[index + 1].focus();
                    } else {
                        document.getElementById('student-form').submit();
                    }
                }
            });
        });
    </script>
</body>
</html>
